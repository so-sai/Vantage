[package]
name = "vantage-benchmark"
version = "0.1.0"
edition = "2021"
description = "Benchmark harness for Vantage — measures IAR, RRF, Half-Life, and Reality Yield against inference-only baselines"

[dependencies]
vantage-core = { path = "../vantage-core" }
vantage-metrics = { path = "../vantage-metrics" }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"

[[bin]]
name = "vantage-benchmark"
path = "src/main.rs"

