[package]
name = "vantage-app"
version = "1.0.0"
edition = "2021"

[lib]
name = "vantage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vantage-core = { path = "../../crates/vantage-core" }
vantage-pek = { path = "../../crates/vantage-pek" }
vantage-runtime = { path = "../../crates/vantage-runtime" }
window-vibrancy = "0.5"
sha2 = "0.10"
